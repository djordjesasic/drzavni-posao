  - {mesto: "57 6:44", imitira: "da", napomena: ""}   # „Da si vrevo, evo je radica…“
  - {mesto: "65 4:29", imitira: "ne", napomena: ""}   # „I on ovako izvuče, a onda se vrati gumica“
  - {mesto: "173 4:12", imitira: "ne", napomena: ""}  # „Kako to misliš da si izgubila recept?“
  - {mesto: "85 3:29", imitira: "ne", napomena: ""}   # „Ja ga nikad nisam…“
  - {mesto: "429 1:59", imitira: "ne", napomena: "jeste imitacija, ali ne Žike"}  # „A on kaže: Franke, popa…“
  - {mesto: "730 9:16", imitira: "ne", napomena: ""}  # „Ja sam idiot, ona je fina žena“
  - {mesto: "117 2:50", imitira: "da", napomena: ""}  # „Glista, meni… kapijenu alkohola“

