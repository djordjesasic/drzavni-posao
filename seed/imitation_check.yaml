# Provera: da li sistem po glasu prepoznaje kad Čvarkov imitira (2026-11-17).
# Za svako mesto preslušaj ~10 s od tog minuta i upiši u "imitira":
#   da  – Čvarkov tu imitira baš tog lika (Žiku, odnosno dođoša)
#   ne  – Čvarkov govori normalno, ili imitira nekog drugog, ili to nije Čvarkov
# U "napomena" po želji: koga zapravo imitira, ko govori...
#
# Rezultat (vlasnik, 2026-11-17): Žika 3/8, dođoš 1/8 -> imitacije se ne prepoznaju po
# glasu; to ostaje opisu (Sonnet), po sadržaju.

ziku:
