# Početni registar likova – Državni posao
# Putanja u repou: seed/characters.yaml
#
# vrsta:
#   glavni        – jedan od tri glavna lika
#   na_ekranu     – sporedni lik koji se pojavljuje na ekranu
#   samo_u_prici  – lik koji postoji samo kroz priču, nikad na ekranu
#   samo_glas     – nikad se ne vidi, ali se ponekad čuje njegov glas
# igra:      id lika čiji glumac igra i ovaj lik (samo za dvostruke uloge)
# nadimci:   sva imena pod kojima se lik pominje; dopuni slobodno
# opis:      kratko, da model razlikuje slične likove
# Polja koja ne znaš ostavi prazna. Obrada će predlagati dopune, a ti ih odobravaš.

glavni:
  - id: cvarkov
    ime: Đorđe Čvarkov
    vrsta: glavni
    nadimci: [Čvarkov, Đorđe, Žorž Papadubi, Čvare Šala, Đoka, Đoko]
    opis: glavni arhivator; osamdesetih je bio finansijski direktor dok je Marjanović bio generalni, autonomas; smenjen u jogurt revoluciji 1989. nasledio Lazara Malinačkog na mestu glavnog arhivatora. zivi sa babom i frau silovickom na pejicevim salasima gde ima i farmu pilica. cesto se u radnom vremenu bavi prodajom pilica i jaja.

  - id: torbica
    ime: Dragan Torbica
    vrsta: glavni
    nadimci: [Torbica, Dragan, Dragan Jove Torbica]
    opis: otac mu je Jovo; često se predstavlja kao „Dragan Jove Torbica“ (ime oca u sredini); dodjos, krajisnik, poreklo srednja bosna. poceo da radi kao vozac u voznom parku. vozio Marjanovića dok je bio generalni i Cvarkova dok je bio finansijski. rezervni potporucnik, zavrsio skolu za rezervne oficire u bileci. studirao odbranu u sarajevu, ali nije zavrsio.

  - id: boskic
    ime: Boškić
    vrsta: glavni
    nadimci: [Boškić]
    opis: najmlađi od trojice; sin Boškića starijeg; u firmu ga je preko veze zaposlio stariji brat. zamenik zamenika glavnog arhivatora, poreklom je Srbijanac (u smislu da je iz Centralne Srbije, tačnije iz sela Donja Kravarica kod Arilja), što Čvarkov često naglašava i iako je rođen u Novom Sadu, Čvarkov mu ne priznaje da je Vojvođanin. Završio je master studije na privatnom fakultetu gde je upisao doktorske studije. U preduzeće ga je zaposlio stariji brat preko veze, a otac mu je „malo pomogao“ tako što mu je rekao koja će pitanja biti na konkursu (sam to priča u epizodi 739); tvrdi da je sve postigao sam. Još u ranom detinjstvu je pokazivao da je sporiji i netalentovaniji od brata i oca, visokog oficira OZNA-e, kasnije UDBA-e. U seriji on predstavlja odraz mladih u Srbiji i odraz njihovog razmišljanja

dvostruke_uloge:
  - id: boskic_stariji
    ime: Boškić stariji
    vrsta: na_ekranu
    igra: boskic
    nadimci: []
    opis: Boškićev otac, penzionisani oficir OZNA-e, kasnije UDBA-e. Učesnik raznih tendera i vlasnik brojnih nekretnina u Srbiji i svetu, kao i računa na Kipru.

  - id: stevica_cvarkov
    ime: Stevica Čvarkov
    vrsta: na_ekranu
    igra: cvarkov
    nadimci: [Stevica]
    opis: Đorđev brat, prodavac usecerenih jabuka

na_ekranu:
  - id: dusko_postar
    ime: Duško poštar
    vrsta: na_ekranu
    nadimci: [Duško, Dule, Duško Tegeltija]
    opis: debeli poštar, Torbičin zemljak; priča mnogo nebitnih priča i dosađuje trojici

  - id: jagoda
    ime: Jagoda spremačica
    vrsta: na_ekranu
    nadimci: [Jagoda, Jagoda Marko]
    opis: spremačica, u firmi preko 30 godina, poznata po oštrom jeziku; udala se za Daneta (bivši grof Sekereši) i ima sina sa njim

  - id: grof_sekeresi
    ime: Grof Sekereši
    vrsta: na_ekranu
    nadimci: [Sekereši, grof, Seki, Danilo, Dane]
    opis: ne mešati sa Danetom od Šljive do Banane. grof sekeresi je vampir koji je ujeo dragana torbicu, ali umesto da torbica postane vampir, sekeresi je postao krajisnik/dodjos. čuveni vampir drakulskog tipa poznat i kao Seki. Lik koji se često pominjao u ranijim epizodama. U petoj sezoni je kidnapovao Torbicu i hteo da ga menja za Šilovičku. Međutim, nakon što je ujeo Torbicu i posisao mu krv, i sam je postao Krajišnik, krstio se, dobio ime Danilo i nadimak Dane, Torbica mu je kum. Sada je kupio plac na Veterničkoj rampi pored Torbičinog, pa mu stalno dosađuje. Stupio u brak sa Jagodom i dobio sina sa njom.

  - id: maticar_ristic
    ime: Biljan Ristić
    vrsta: na_ekranu
    nadimci: [matičar, Ristić]
    opis: matičar; tuži trojicu arhivatora u Strazburu jer čeka rešenje svog predmeta

samo_u_prici:
  - id: baba_cvarkov
    ime: Baba Čvarkov
    vrsta: samo_u_prici
    nadimci: [baba Čvarkov]
    opis: baba djordja cvarkova. poznata po svojim kartaroskim i kockarskim vezama i umecima, svi joj duguju pare. "drzala pikslu" za kockanje, mnoge "odrala" na barbutu.

  - id: frau_silovicka
    ime: Frau Šilovička
    vrsta: samo_u_prici
    nadimci: [Šilovička, gospođa fon Šilović]
    opis: kućna prijateljica porodice Čvarkov, po poreklu je polu „Švabica” polu Čehinja, čist primer k. und k. kulture, za nju se saznalo da je završila mušku gimnaziju u Beču 1812. i da se bavila nekom vrstom prostitucije jer je, kako Čvarkov kaže, „držala javnu kuću” ili „bordel” i da se borila da se njen posao „legalizuje”, ali kako Čvarkov kaže izuzetno držeća, „u biciklističkim (pantalonama) sa 400-500 metara još uvek može da prevari”, ima onu „finu patinu na licu da joj možeš strugati dletom”. Kada je bila mlada, u jednom dvorcu u istočnom Banatu, nju je ugrizao vampir grof Sekereši, ali se nije pretvorila u istog jer „nije bila devica” i imala je ljubavne afere sa skoro svim istorijskim ličnostima. Odmalena uz porodicu Čvarkov i malog Đorđa je pratila kad su god išli u inostranstvo. Poseduje češku deviznu penziju i stan u centru grada koji Čvarkov izdaje i uzima kiriju za njega.

  - id: zivan_radosavljevic
    ime: Živan Radosavljević
    vrsta: samo_u_prici
    nadimci: [Živan, Čika Žika, Žika, Žiko]
    opis: „d” se piše, ali se ne čita - čika Žika - skraćeno Žika (po Torbici Žiko) - težak alkoholičar i komšija porodice Čvarkov. Srbijanac iz Majdanpeka, „ali fin čovek”, kako Čvarkov kaže. Torbica uvek voli da ga pohvali govoreći, „ma Žiko je dobar čovjek!”. Njegova mama Mila nije imala mleka da ga doji pa ga je dala u cirkus da ga doji bradata žena, koju je on posle zvao mamom. Otac mu se zvao Milun. Mladost je proveo u cirkusu gde je čak godinu i po dana glumio lava. Spoljni momak i komšija Čvarkovih. Zadužen za sve nezahvalne poslove na Pejićevim Salašima, posebno za transport familije Čvarkov, koju prevozi na motoru sa prikolicom koji mu je ostavio Šicer. Bio je železničar, ali kako se ispostavilo „nevino optužen” da je ukrao pragove sa železnice koje su kasnije ugradili u kokošinjac. Čvarkov ga je vodio na miting 9. marta 1991. u Beogradu gde je Žika onako pijan uzeo policijskog konja i pokušao da na juriš zauzme skupštinu. Žiku su našli, a konja prodali Belom Bori zajedno sa perjem koje nosiše da mu prodaju. Za Žikin lik, pored alkoholizma, bitno je pomenuti da je dobio četiri šamara od Steve Višekrune, i to u rudniku, jer je pevao protiv Tita. Navodno, Žika ima sina, takođe alkoholičara, 44-ogodišnjeg fudbalera u Glogonju, kog zovu Kostolom. Za vreme bitke na Sutjesci bio je član Titove garde.

