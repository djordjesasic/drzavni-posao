# Proba sa kadrovima: epizode gde je poenta (i) u slici, ne samo u govoru.
# Svaki unos: epizoda i šta se vidi a ne čuje (to treba da opis uhvati).
epizode:
  - epizoda: 254
    vidi_se: Torbica glumi da je drogiran da bi sam pojeo ovčiju glavu
  - epizoda: 776
    vidi_se: Čvarkov obučen kao glavni hirurg, Boškić i Dragan mu asistiraju dok vadi mozak iz ovčije glave za pohovani mozak a la Čvarkov
  # Izabrao Claude iz pilot.yaml (2026-11-16):
  - epizoda: 768
    vidi_se: Rumunija, grof Sekereši kao vampir i posle ujeda kao dođoš (kostim, okruženje)
  - epizoda: 585
    vidi_se: Stevica sa ušećerenim jabukama; Boškić ulazi i misli da je Stevica Đorđe (isti glumac)
  - epizoda: 730
    vidi_se: prvo pojavljivanje Jagode (da li je opis prepozna kao novi lik)
  # Vlasnik dodaje još 5:
  - epizoda: 777
    vidi_se: Čvarkov u odelu sedi, ispred njega na stolu gomila brašna, scena kao iz Scarface-a (Toni Montana pred gomilom narkotika)
  - epizoda: 818
    vidi_se: Dragan siri pelene na susilo u kancelariji da se susi
  - epizoda: 188
    vidi_se: Dragan obucen kao odzacar
  - epizoda: 300
    vidi_se: Sva trojica obuceni kao spartanci
  - epizoda: 401
    vidi_se: Dragan lezi ispod stolice na kojoj sedi Cvarkov i razmontirava bombu.
  - epizoda: 1556
    vidi_se: Dragan ispituje osumnjičenog u kancelariji pretvorenoj u sobu za saslušanje — crveno svetlo, lampa uperena u lice; osumnjičeni (Prelepi Miške) vezan konopcem za stolicu, izubijan, u crvenom sakou i perici
  - epizoda: 1443
    vidi_se: Jagoda mesi testo, Boskic dolazi i unosi brasno. Scena kao iz filma Varljivo leto.
  - epizoda: 815
    vidi_se: dragan ulazi u kancelariju sa cebetom i leze na sto da spava
  - epizoda: 640
    vidi_se: cvarkov u vodjvodjanskoj narodnoj nosnji, torbica u lickoj narodnoj nosnji