name: drzavni-posao

x-common: &common
  image: drzavni-posao:latest
  user: "1000:1000"
  environment:
    TZ: Europe/Belgrade
    DP_CONFIG: /app/config.toml
    HOME: /data/home
    RUFF_CACHE_DIR: /tmp/ruff-cache
    # Same value as uvicorn's --port below, so allowed_hosts always matches the bind port.
    DP_API_PORT: "${DP_API_PORT:-8090}"
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/data

services:
  api:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Host networking: uvicorn binds the Tailscale address itself. If tailscaled is not
    # up yet at boot, uvicorn exits and the restart policy retries until the bind works
    # (a published port would instead leave the container never started).
    network_mode: host
    command:
      - uvicorn
      - dp.search.app:app
      - --host
      - ${DP_BIND_ADDR:?DP_BIND_ADDR must be set in .env}
      - --port
      - "${DP_API_PORT:-8090}"
    restart: unless-stopped

  worker:
    <<: *common
    profiles: ["worker"]
    command: ["python", "-m", "dp.cli", "worker"]
    restart: unless-stopped

  # bge-m3 embeddings on the CPU (text-embeddings-inference). No GPU: the mini PC's
  # GPU belongs to the other project. Reachable as http://embed from the worker and
  # on 127.0.0.1:8091 from the host network (api); nothing is exposed outside.
  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    user: "1000:1000"
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "32"]
    environment:
      HF_HOME: /data
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - ./data/models/tei:/data
    ports:
      - "127.0.0.1:8091:80"
    cpus: 4
    restart: unless-stopped
